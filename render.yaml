services:
  - type: web
    name: meeting-spot-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    nodeVersion: "20"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: meeting-spot-backend
          property: port
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-spot-prod-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://findameetingspot.com
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
    autoDeploy: true
    repo: https://github.com/groots/meeting-spot-backend.git
    branch: main
    
databases:
  - name: meeting-spot-prod-db
    databaseName: meeting_spot
    user: meeting_spot_user
    plan: free 