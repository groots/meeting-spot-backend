runtime: python39

service: backend

instance_class: F1

env_variables:
  FLASK_APP: "wsgi.py"
  FLASK_ENV: "production"
  GOOGLE_CLOUD_PROJECT: "find-a-meeting-spot"
  FRONTEND_URL: "https://find-a-meeting-spot.ue.r.appspot.com"
  LOG_LEVEL: "INFO"
  DATABASE_URL: "postgresql+pg8000:///findameetingspot?unix_sock=/cloudsql/find-a-meeting-spot:us-east1:findameetingspot/.s.PGSQL.5432"
  CORS_ORIGINS: "https://find-a-meeting-spot.ue.r.appspot.com,https://find-a-meeting-spot.web.app,https://findameetingspot.com,https://www.findameetingspot.com,https://api.findameetingspot.com"

entrypoint: gunicorn -b :$PORT wsgi:app

beta_settings:
  cloud_sql_instances: find-a-meeting-spot:us-east1:findameetingspot

vpc_access_connector:
  name: "projects/find-a-meeting-spot/locations/us-east1/connectors/meeting-spot-connector"

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10
  target_throughput_utilization: 0.6

handlers:
- url: /debug/.*
  script: auto
  secure: always
  http_headers:
    Access-Control-Allow-Origin: '*'
    Access-Control-Allow-Methods: 'GET, POST, OPTIONS, PUT, DELETE'
    Access-Control-Allow-Headers: 'Origin, X-Requested-With, Content-Type, Accept, Authorization'
    Access-Control-Max-Age: '3600'
    Access-Control-Allow-Credentials: 'true'

- url: /api/v1/.*
  script: auto
  secure: always
  http_headers:
    Access-Control-Allow-Origin: '*'
    Access-Control-Allow-Methods: 'GET, POST, OPTIONS, PUT, DELETE'
    Access-Control-Allow-Headers: 'Origin, X-Requested-With, Content-Type, Accept, Authorization'
    Access-Control-Max-Age: '3600'
    Access-Control-Allow-Credentials: 'true'

- url: /api/v2/.*
  script: auto
  secure: always
  http_headers:
    Access-Control-Allow-Origin: '*'
    Access-Control-Allow-Methods: 'GET, POST, OPTIONS, PUT, DELETE'
    Access-Control-Allow-Headers: 'Origin, X-Requested-With, Content-Type, Accept, Authorization'
    Access-Control-Max-Age: '3600'
    Access-Control-Allow-Credentials: 'true'

- url: /api/v1/swagger/swaggerui/.*
  static_dir: static/swaggerui
  secure: always
  http_headers:
    Access-Control-Allow-Origin: '*'
    Access-Control-Allow-Methods: 'GET, OPTIONS'
    Access-Control-Allow-Headers: 'Origin, X-Requested-With, Content-Type, Accept'
    Access-Control-Max-Age: '3600'

- url: /.*
  script: auto
  secure: always
  http_headers:
    Access-Control-Allow-Origin: '*'
    Access-Control-Allow-Methods: 'GET, POST, OPTIONS, PUT, DELETE'
    Access-Control-Allow-Headers: 'Origin, X-Requested-With, Content-Type, Accept, Authorization'
    Access-Control-Max-Age: '3600'
    Access-Control-Allow-Credentials: 'true'

includes:
- secret_settings.yaml
