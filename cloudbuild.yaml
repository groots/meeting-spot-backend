steps:
# Run migrations first
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: /bin/bash
  args:
  - '-c'
  - |
    echo "Running database migrations..."
    # Build a special container for running migrations
    gcloud builds submit --tag gcr.io/$PROJECT_ID/migration-runner:$COMMIT_SHA --no-source
    # Run migrations with proper database connection
    gcloud run jobs create migration-job-$COMMIT_SHA \
    --image gcr.io/$PROJECT_ID/migration-runner:$COMMIT_SHA \
    --region us-east1 \
    --set-cloudsql-instances=find-a-meeting-spot:us-east1:findameetingspot \
    --set-env-vars="FLASK_APP=wsgi.py,FLASK_ENV=production,RUN_MIGRATIONS=true,INSTANCE_CONNECTION_NAME=find-a-meeting-spot:us-east1:findameetingspot" \
    --memory=512Mi \
    --vpc-connector=projects/$PROJECT_ID/locations/us-east1/connectors/cloudrun-connector \
    --execute-now
    echo "Migrations completed successfully"

# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'meeting-spot-backend'
  - '--image'
  - 'gcr.io/$PROJECT_ID/meeting-spot-backend:$COMMIT_SHA'
  - '--region'
  - 'us-east1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--set-env-vars'
  - 'FLASK_ENV=production,RUN_MIGRATIONS=false,INSTANCE_CONNECTION_NAME=find-a-meeting-spot:us-east1:findameetingspot,CORS_ORIGINS=*'
  - '--add-cloudsql-instances'
  - 'find-a-meeting-spot:us-east1:findameetingspot'

# Build the container image
images:
- 'gcr.io/$PROJECT_ID/meeting-spot-backend:$COMMIT_SHA'
- 'gcr.io/$PROJECT_ID/migration-runner:$COMMIT_SHA'

timeout: '1800s'  # Increase timeout to allow for migrations to complete

options:
  logging: CLOUD_LOGGING_ONLY
