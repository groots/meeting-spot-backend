steps:
# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'meeting-spot-backend'
  - '--image'
  - 'gcr.io/$PROJECT_ID/meeting-spot-backend:$COMMIT_SHA'
  - '--region'
  - 'us-east1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--set-env-vars'
  - 'FLASK_ENV=production,RUN_MIGRATIONS=false,INSTANCE_CONNECTION_NAME=find-a-meeting-spot:us-east1:findameetingspot,CORS_ORIGINS=*'
  - '--add-cloudsql-instances'
  - 'find-a-meeting-spot:us-east1:findameetingspot'

# Build the container image
images:
- 'gcr.io/$PROJECT_ID/meeting-spot-backend:$COMMIT_SHA'
