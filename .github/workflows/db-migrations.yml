name: Database Migrations

# Add concurrency configuration to cancel in-progress runs and avoid conflicts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'migrations/**'
      - 'app/models/**'
      - 'github_migrations.py'
      - '.github/workflows/db-migrations.yml'
      # Explicitly exclude other files that trigger CI/CD
      - '!app/api/**'
      - '!app/utils/**'
      - '!app/config/**'
      - '!app/__init__.py'
      - '!app/cors_middleware.py'
      - '!app/middleware.py'
      - '!requirements.txt'
      - '!Dockerfile'
      - '!.github/workflows/ci-cd.yml'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run migrations even if already triggered by CI/CD'
        required: false
        default: false
        type: boolean

jobs:
  # This job ensures we don't have duplicate workflows running
  check-duplicate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - id: check
        name: Check if force run or only migration files changed
        run: |
          # If manually triggered with force_run, always proceed
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_run }}" == "true" ]]; then
            echo "Force run requested, proceeding with DB migrations"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Safer approach that doesn't rely on GitHub API
          echo "Checking if only migration files were changed..."
          
          # Default to not running this workflow unless we confirm migration changes
          echo "should_run=false" >> $GITHUB_OUTPUT
          
          # Try to get the list of changed files
          if ! CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null); then
            echo "Warning: Could not get file diff. Skipping this workflow."
            exit 0
          fi
          
          # Check for migration files or model changes
          MIGRATION_FILES=$(echo "$CHANGED_FILES" | grep -E '^migrations/|github_migrations.py|^app/models/' || echo "")
          APP_FILES=$(echo "$CHANGED_FILES" | grep -E '^app/' | grep -v -E '^app/models/' || echo "")
          
          if [[ -n "$MIGRATION_FILES" && -z "$APP_FILES" ]]; then
            echo "Only migration or model files changed, proceeding with DB migration workflow"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "App files changed outside models, leaving to CI/CD workflow"
          fi

  check-migrations:
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+pg8000://postgres:postgres@localhost:5432/test_db
      FLASK_ENV: testing
      ENCRYPTION_KEY: test_key_for_ci_123456789012345678901234
      JWT_SECRET_KEY: test_jwt_key_for_ci_123456789012345678901234

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories for Flask app
        run: |
          mkdir -p instance/profile_pictures
          mkdir -p logs

      - name: Database Diagnostic Info
        run: |
          # Get PostgreSQL version and connection info
          echo "PostgreSQL Info:"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "SELECT version();"

          # Check if we can connect from Python
          python -c "import pg8000; conn = pg8000.connect(user='postgres', password='postgres', host='localhost', port=5432, database='test_db'); print('Connected successfully'); cursor = conn.cursor(); cursor.execute('SELECT version()'); print(cursor.fetchone()[0]); conn.close()"

      - name: Run migrations with custom script
        run: |
          # Make the migrations script executable
          chmod +x github_migrations.py

          # Run migrations with skip-errors flag for CI
          python github_migrations.py --upgrade --skip-errors

      - name: Summary
        run: |
          echo "## Database Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "* Attempted to apply migrations to test database" >> $GITHUB_STEP_SUMMARY
          echo "* This workflow does not affect production database" >> $GITHUB_STEP_SUMMARY
          echo "* See logs for detailed results" >> $GITHUB_STEP_SUMMARY
