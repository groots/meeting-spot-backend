name: CI Deploy (DISABLED)

# This workflow is disabled - using ci-cd.yml instead
# Rename this file back to ci-deploy.yaml to re-enable
on:
  # Workflow disabled - these triggers won't run anymore
  workflow_dispatch:  # Only manual trigger left for debugging

jobs:
  # Configure database migrations
  setup-migrations:
    uses: ./.github/workflows/migration-config.yaml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'ci' }}

  # Run tests and linting
  test:
    runs-on: ubuntu-latest
    needs: setup-migrations

    env:
      CI_IGNORE_DB_CONNECTION_ERRORS: true
      CI_IGNORE_DB_ERRORS: true
      SKIP_DB_MIGRATIONS_IN_CI: true  # Always skip in CI
      DATABASE_URL: 'sqlite:////memory'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        cache: 'pip'

    - name: Install dependencies

      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-flask black isort

    - name: Black code style check

      run: |
        black --check .

    - name: Run tests

      run: |
        # Set testing environment
        export FLASK_ENV=testing
        export FLASK_APP=app:create_app
        export DATABASE_URL='sqlite:////memory'

        # Run tests
        pytest

  # Deploy to production
  deploy:
    runs-on: ubuntu-latest
    needs: [setup-migrations, test]
    if: github.ref == 'refs/heads/main'

    env:
      # Force migration skipping in CI
      CI: "true"
      CI_IGNORE_DB_CONNECTION_ERRORS: "true"
      CI_IGNORE_DB_ERRORS: "true"
      SKIP_DB_MIGRATIONS_IN_CI: "true"
      FORCE_DB_MIGRATIONS_IN_CI: "false"

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        cache: 'pip'

    - name: Install dependencies

      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Google Cloud SDK
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SQL Proxy
      uses: google-github-actions/setup-gcloud@v1

    - name: Set database migration strategy
      run: |
        echo "## Database Migration Strategy" >> $GITHUB_STEP_SUMMARY
        echo "Skipping migrations in CI environment" >> $GITHUB_STEP_SUMMARY
        echo "Migrations will be applied in production environment using the dedicated migration workflow" >> $GITHUB_STEP_SUMMARY
        echo "To run migrations in production, use the 'Production Database Migrations' workflow" >> $GITHUB_STEP_SUMMARY

    - name: Skip database migrations (deployment only)

      env:
        CI: "true"
        SKIP_DB_MIGRATIONS_IN_CI: "true"
        FLASK_APP: app:create_app
      run: |
        echo "Explicitly skipping database migrations in CI environment"
        echo "To run migrations, use the dedicated 'Production Database Migrations' workflow"
        echo "## ⏩ Database Migrations Skipped" >> $GITHUB_STEP_SUMMARY
        echo "Migrations were skipped and will be handled separately" >> $GITHUB_STEP_SUMMARY

    - name: Deploy to Cloud Run

      env:
        GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        GCP_REGION: ${{ secrets.GCP_REGION }}
      run: |
        # Deploy using your existing deployment script
        ./deploy_to_cloud_run.sh

    - name: Verify deployment
      run: |
        echo "Deployment completed. Verify the application is running correctly."
        echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "Application has been deployed to Cloud Run." >> $GITHUB_STEP_SUMMARY
        echo "**Note**: Database migrations were skipped. Run migrations separately using the dedicated workflow." >> $GITHUB_STEP_SUMMARY
